        /* Drag n Drop Object - By Nikhil */
        var SwipeMe;

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev, el) {
            ev.dataTransfer.setData("text", ev.target.id);
            SwipeMe = el.parentNode;
        }

        function drop(ev, el) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");

            if (el.children.length > 0) {
                //for (var i = 0; i < el.children.length; i++) {
                SwipeMe.appendChild(document.getElementById(el.children[0].id));
                //}
            }

            //ev.target.appendChild(document.getElementById(data));
            el.appendChild(document.getElementById(data));
        }
        /* End Drag n Drop */

        function IsNumeric(e) {
            var k;
            document.all ? k = e.keyCode : k = e.which;
            return ((k > 47 && k < 58) || (k == 8));

    function setProc(reloadurl, title) {
      
        if (title == 1) {
            refreshIntervalId = setInterval("showPopBid(" + reloadurl + ");", 10000);
        }
        else {
            refreshIntervalId = setInterval("showPop(" + reloadurl + ");", 10000);
        } 
    };



    function showPop(reloadurl) {
        if (stop) {
            return false;
        }
        else {
            $.ajax({

                type: "POST",
                url: "FlightTrip.aspx/fillwait",
                 //url: reloadurl +"/fillwait",
                data: '{Employeeid: "' + reloadurl + '" }',
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function (response) {

                    if (response.d.split('*')[0] != "") {

                        stop = true;
                        var lblmsg = $("#PopUpUC_lblMsgWarning");
                        lblmsg[0].textContent = response.d.split('*')[0];
                        clearInterval(refreshIntervalId);
                        ShowMsgBox("ACeeptReject", response.d, true, 'flighttrip.aspx', '');
                    }
                    else {
                    }
                },
                error: function () {
                    alert('Error');
                }
            });
        }
    }
